<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favorite Things</title>
<style>
  :root { color-scheme: light dark; --bg:#faf7f2; --card:#fff; --fg:#201a17; --muted:#7a6f68; --line:#e4dcd2; --accent:#c8442d; --accent-fg:#fff; --danger:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17130f; --card:#221c17; --fg:#f3ece4; --muted:#a39688; --line:#372f27; --accent:#ee7a62; --accent-fg:#1a0d08; --danger:#ff8a80; } }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  h1 { margin:0; font:700 22px/1 Georgia, "Times New Roman", serif; letter-spacing:-.01em; }
  .who { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); min-width:0; }
  .who b { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:30vw; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:8px 14px; }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=email], input[type=password], textarea { width:100%; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #post { display:grid; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:20px; }
  #post h2 { margin:0; font-size:16px; }
  #preview { max-width:100%; max-height:260px; border-radius:8px; object-fit:contain; justify-self:start; }
  #signedout { text-align:center; color:var(--muted); padding:18px; border:1px dashed var(--line); border-radius:12px; margin-bottom:20px; }
  #feed { columns:240px; column-gap:14px; }
  .item { break-inside:avoid; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:0 0 14px; }
  .item img { display:block; width:100%; height:auto; }
  .item .body { padding:10px 12px 12px; }
  .item h3 { margin:0; font-size:17px; overflow-wrap:anywhere; }
  .item p { margin:4px 0 0; overflow-wrap:anywhere; }
  .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; font-size:13px; color:var(--muted); }
  .del { padding:2px 8px; font-size:13px; color:var(--danger); }
  #empty { text-align:center; color:var(--muted); padding:40px 0; }
  #msg { min-height:1.4em; font-size:14px; color:var(--muted); }
  #msg.err { color:var(--danger); }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); padding:20px; width:min(360px, calc(100vw - 32px)); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog form { display:grid; gap:10px; }
  dialog h2 { margin:0; font-size:18px; }
  .row { display:flex; gap:8px; justify-content:flex-end; }
  .link { background:none; border:none; padding:0; color:var(--accent); text-decoration:underline; justify-self:start; }
</style>
</head>
<body>
<header>
  <h1>Favorite Things</h1>
  <div class="who" id="who"><button id="openAuth" class="primary">Log in / Sign up</button></div>
</header>

<main>
  <form id="post" hidden>
    <h2>Post one of your favorite things</h2>
    <input id="title" type="text" maxlength="80" placeholder="What is it? (e.g. Blue Ridge sunsets)" required>
    <textarea id="note" rows="2" maxlength="300" placeholder="Why do you love it? (optional)"></textarea>
    <input id="file" type="file" accept="image/*" required>
    <img id="preview" alt="" hidden>
    <div class="row"><span id="msg" style="margin-right:auto"></span><button class="primary" id="submitPost">Post</button></div>
  </form>
  <div id="signedout">Log in or sign up to post your own favorite things.</div>

  <div id="feed"></div>
  <div id="empty" hidden>Nothing here yet. Be the first to post.</div>
</main>

<dialog id="authDlg">
  <form id="authForm" method="dialog">
    <h2 id="authTitle">Log in</h2>
    <input id="name" type="text" maxlength="30" placeholder="Display name" autocomplete="nickname" hidden>
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" required minlength="6">
    <div id="authMsg" class="err" style="font-size:14px"></div>
    <div class="row">
      <button type="button" id="cancelAuth">Cancel</button>
      <button class="primary" id="authGo">Log in</button>
    </div>
    <button type="button" class="link" id="toggleAuth">New here? Create an account</button>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, remove, onValue, query, limitToLast, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyDRV3K3DQ_LEyvZB-w77BmpD5QDHDSdNWA",
  authDomain: "mtgapp-aacbd.firebaseapp.com",
  databaseURL: "https://mtgapp-aacbd-default-rtdb.firebaseio.com",
  projectId: "mtgapp-aacbd",
});
const auth = getAuth(app);
const db = getDatabase(app);
const $ = id => document.getElementById(id);
const openAuthBtn = $("openAuth");

let user = null;
let signup = false;
let imageData = null;
let posts = [];

// ---------- auth ----------
function authError(e) {
  const c = e.code || "";
  if (c.includes("operation-not-allowed")) return "Email sign-in isn't turned on in Firebase yet.";
  if (c.includes("email-already-in-use")) return "That email already has an account. Try logging in.";
  if (c.includes("weak-password")) return "Password needs at least 6 characters.";
  if (c.includes("invalid-email")) return "That email doesn't look right.";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Wrong email or password.";
  if (c.includes("too-many-requests")) return "Too many tries. Wait a minute and try again.";
  return "Couldn't sign in (" + (c || e.message) + ")";
}

function setMode(isSignup) {
  signup = isSignup;
  $("authTitle").textContent = isSignup ? "Create an account" : "Log in";
  $("authGo").textContent = isSignup ? "Sign up" : "Log in";
  $("name").hidden = !isSignup;
  $("name").required = isSignup;
  $("pass").autocomplete = isSignup ? "new-password" : "current-password";
  $("toggleAuth").textContent = isSignup ? "Have an account? Log in" : "New here? Create an account";
  $("authMsg").textContent = "";
}

$("openAuth").addEventListener("click", () => { setMode(false); $("authDlg").showModal(); });
$("cancelAuth").addEventListener("click", () => $("authDlg").close());
$("toggleAuth").addEventListener("click", () => setMode(!signup));

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("authGo").disabled = true;
  $("authMsg").textContent = "";
  try {
    const email = $("email").value.trim(), pass = $("pass").value;
    if (signup) {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: $("name").value.trim().slice(0, 30) });
      user = auth.currentUser;
      renderWho();
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    $("authDlg").close();
    $("authForm").reset();
  } catch (err) {
    $("authMsg").textContent = authError(err);
  } finally {
    $("authGo").disabled = false;
  }
});

function renderWho() {
  const who = $("who");
  who.textContent = "";
  if (user) {
    const b = document.createElement("b");
    b.textContent = user.displayName || user.email;
    const out = document.createElement("button");
    out.textContent = "Log out";
    out.addEventListener("click", () => signOut(auth));
    who.append(b, out);
  } else {
    who.appendChild(openAuthBtn);
  }
  $("post").hidden = !user;
  $("signedout").hidden = !!user;
  renderFeed();
}

onAuthStateChanged(auth, u => { user = u; renderWho(); });

// ---------- posting ----------
function shrink(file, max = 900, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a picture we can read.")); };
    img.src = url;
  });
}

function say(text, isErr) { const m = $("msg"); m.textContent = text; m.className = isErr ? "err" : ""; }

$("file").addEventListener("change", async () => {
  imageData = null;
  $("preview").hidden = true;
  const f = $("file").files[0];
  if (!f) return;
  try {
    imageData = await shrink(f);
    $("preview").src = imageData;
    $("preview").hidden = false;
    say("");
  } catch (e) { say(e.message, true); }
});

$("post").addEventListener("submit", async e => {
  e.preventDefault();
  if (!user || !imageData) { say("Pick a picture first.", true); return; }
  $("submitPost").disabled = true;
  say("Posting…");
  try {
    await push(ref(db, "favorites"), {
      uid: user.uid,
      author: (user.displayName || user.email.split("@")[0]).slice(0, 30),
      title: $("title").value.trim().slice(0, 80),
      note: $("note").value.trim().slice(0, 300),
      image: imageData,
      ts: serverTimestamp(),
    });
    $("post").reset();
    $("preview").hidden = true;
    imageData = null;
    say("Posted.");
  } catch (err) {
    say(err.code === "PERMISSION_DENIED" ? "Posting is blocked by the database rules." : "Couldn't post (" + (err.code || err.message) + ")", true);
  } finally {
    $("submitPost").disabled = false;
  }
});

// ---------- feed ----------

function renderFeed() {
  const feed = $("feed");
  feed.textContent = "";
  $("empty").hidden = posts.length > 0;
  for (const p of posts) {
    const item = document.createElement("article");
    item.className = "item";
    const img = document.createElement("img");
    img.src = p.image;
    img.alt = p.title;
    img.loading = "lazy";
    const body = document.createElement("div");
    body.className = "body";
    const h = document.createElement("h3");
    h.textContent = p.title;
    body.appendChild(h);
    if (p.note) { const n = document.createElement("p"); n.textContent = p.note; body.appendChild(n); }
    const meta = document.createElement("div");
    meta.className = "meta";
    const by = document.createElement("span");
    by.textContent = "by " + p.author;
    meta.appendChild(by);
    if (user && user.uid === p.uid) {
      const d = document.createElement("button");
      d.className = "del";
      d.textContent = "Delete";
      d.addEventListener("click", () => {
        if (d.dataset.sure) { remove(ref(db, "favorites/" + p.id)); return; }
        d.dataset.sure = "1"; d.textContent = "Tap again to delete";
        setTimeout(() => { delete d.dataset.sure; d.textContent = "Delete"; }, 3000);
      });
      meta.appendChild(d);
    }
    body.appendChild(meta);
    item.append(img, body);
    feed.appendChild(item);
  }
}

onValue(query(ref(db, "favorites"), limitToLast(40)), snap => {
  const list = [];
  snap.forEach(c => { const v = c.val(); if (v && v.image) list.push({ id: c.key, ...v }); });
  posts = list.reverse();
  renderFeed();
}, () => { $("empty").hidden = false; $("empty").textContent = "Can't load posts right now."; });
</script>
</body>
</html>
