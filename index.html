<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favorite Things</title>
<meta name="theme-color" content="#7a4a22">
<meta name="description" content="Share your favorite things with friends.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Favorites">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<style>
  /* Valley farm look: parchment panels, wood frames, grass-green buttons, pixel scene in the header */
  :root { color-scheme: light dark; --bg:#e9cf94; --card:#f8e8bf; --fg:#4a2e17; --muted:#8a6a44; --wood:#7a4a22; --wood-lt:#c98d4a; --shade:#4b2c12; --accent:#5aa83c; --accent-dk:#2f6b24; --accent-fg:#fff; --danger:#a8321f; --field:#fff6dc; --sky1:#8fd3f4; --sky2:#bfe8f7; --hill:#6fb94a; --hill2:#4f9a3a; --sun:#ffd84a; --cloud:#ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1d2638; --card:#3a2a1f; --fg:#f1dfb8; --muted:#bfa27a; --wood:#2a1a0e; --wood-lt:#8a5a2e; --shade:#0e0905; --accent:#6dbb4a; --accent-dk:#2d6a26; --accent-fg:#10210b; --danger:#ff8a70; --field:#2b1e15; --sky1:#2c3e78; --sky2:#c3809a; --hill:#2f6a3a; --hill2:#245430; --sun:#f7e7a0; --cloud:#e3c6d6; } }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:400 17px/1.4 "Pixelify Sans", "Courier New", monospace; }
  header { position:sticky; top:0; z-index:5; background:var(--wood); border-bottom:4px solid var(--shade); box-shadow:0 4px 0 var(--wood-lt) inset; }
  #scene { display:block; width:100%; height:96px; image-rendering:pixelated; border-bottom:4px solid var(--shade); }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; }
  h1 { margin:0; font:400 16px/1.3 "Press Start 2P", monospace; color:#ffe9b0; text-shadow:2px 2px 0 var(--shade); }
  .who { display:flex; align-items:center; gap:10px; font-size:15px; color:#ffe9b0; min-width:0; }
  .who b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:30vw; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  button { font:inherit; font-weight:600; cursor:pointer; color:var(--fg); background:var(--wood-lt); border:3px solid var(--shade); border-radius:0; padding:6px 12px; box-shadow:inset 0 3px 0 rgba(255,255,255,.35), 0 3px 0 var(--shade); }
  button:active { transform:translateY(3px); box-shadow:inset 0 3px 0 rgba(255,255,255,.35); }
  button.primary { background:var(--accent); color:var(--accent-fg); }
  button:disabled { opacity:.55; cursor:default; }
  input[type=text], input[type=email], input[type=password], textarea { width:100%; font:inherit; color:var(--fg); background:var(--field); border:3px solid var(--wood); border-radius:0; padding:9px; box-shadow:inset 3px 3px 0 rgba(0,0,0,.15); }
  input[type=file] { font:inherit; max-width:100%; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .panel { background:var(--card); border:4px solid var(--wood); box-shadow:0 0 0 3px var(--wood-lt) inset, 0 5px 0 var(--shade); border-radius:0; }
  #post { display:grid; gap:10px; padding:16px; margin-bottom:22px; }
  #post h2 { margin:0; font:400 13px/1.4 "Press Start 2P", monospace; }
  #preview { max-width:100%; max-height:260px; object-fit:contain; justify-self:start; border:3px solid var(--wood); image-rendering:auto; }
  #signedout { text-align:center; padding:18px; margin-bottom:22px; }
  .feed { display:grid; gap:10px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button.on { background:var(--accent); color:var(--accent-fg); }
  .muted { color:var(--muted); text-align:center; padding:24px 0; }
  #search { margin-bottom:12px; }
  #peopleList { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .person { width:100%; text-align:left; font-size:19px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .person small { color:var(--muted); font-size:14px; }
  .profname { margin:0; font:400 14px/1.4 "Press Start 2P", monospace; overflow-wrap:anywhere; }
  .by { font:inherit; font-size:14px; }
  .passrow { display:flex; gap:8px; }
  .passrow input { flex:1; min-width:0; }
  #authMsg.ok { color:var(--accent-dk); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #authMsg.ok { color:var(--accent); } }
  .prow { width:100%; text-align:left; display:flex; flex-direction:column; gap:2px; padding:12px 14px; font-size:19px; }
  .prow small { color:var(--muted); font-size:14px; }
  .ptitle { overflow-wrap:anywhere; }
  #postDlg img { display:block; max-width:100%; max-height:60vh; margin:0 auto 12px; border:3px solid var(--wood); }
  #postDlg h3 { margin:0; font-size:20px; overflow-wrap:anywhere; }
  #postDlg p { margin:6px 0 0; overflow-wrap:anywhere; }
  .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; font-size:14px; color:var(--muted); }
  .del { padding:1px 8px; font-size:14px; color:var(--danger); box-shadow:0 2px 0 var(--shade); }
  #empty { text-align:center; color:var(--muted); padding:40px 0; }
  #msg { min-height:1.4em; font-size:15px; color:var(--muted); }
  #msg.err { color:var(--danger); }
  dialog { color:var(--fg); padding:20px; width:min(380px, calc(100vw - 32px)); background:var(--card); border:4px solid var(--wood); box-shadow:0 0 0 3px var(--wood-lt) inset, 0 5px 0 var(--shade); border-radius:0; }
  dialog::backdrop { background:rgba(20,10,0,.6); }
  dialog form { display:grid; gap:10px; }
  dialog h2 { margin:0; font:400 14px/1.4 "Press Start 2P", monospace; }
  .row { display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  .link { background:none; border:none; box-shadow:none; padding:0; color:var(--accent-dk); text-decoration:underline; justify-self:start; }
  .link:active { transform:none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link { color:var(--accent); } }
  @media (max-width:480px) { h1 { font-size:12px; } #scene { height:72px; } }
</style>
</head>
<body>
<header>
  <canvas id="scene" width="240" height="36" aria-hidden="true"></canvas>
  <div class="bar">
    <h1>Favorite Things</h1>
    <div class="who" id="who"><button id="openAuth" class="primary">Log in / Sign up</button></div>
  </div>
</header>

<main>
  <nav class="tabs">
    <button type="button" id="tabFeed" class="on">Posts</button>
    <button type="button" id="tabPeople">People</button>
  </nav>

  <section id="vPeople" hidden>
    <input id="search" type="text" placeholder="Search people" autocomplete="off">
    <ul id="peopleList"></ul>
    <div id="peopleEmpty" class="muted" hidden>No one found.</div>
  </section>

  <section id="vProfile" hidden>
    <div class="row" style="justify-content:flex-start; margin-bottom:14px">
      <button type="button" id="backBtn">Back</button>
      <h2 id="profName" class="profname"></h2>
    </div>
    <div id="profFeed" class="feed"></div>
    <div id="profEmpty" class="muted" hidden>No favorites posted yet.</div>
  </section>

  <div id="vFeed">
  <form id="post" class="panel" hidden>
    <h2>Post one of your favorite things</h2>
    <input id="title" type="text" maxlength="80" placeholder="What is it? (e.g. Blue Ridge sunsets)" required>
    <textarea id="note" rows="2" maxlength="300" placeholder="Why do you love it? (optional)"></textarea>
    <input id="file" type="file" accept="image/*" required>
    <img id="preview" alt="" hidden>
    <div class="row"><span id="msg" style="margin-right:auto"></span><button class="primary" id="submitPost">Post</button></div>
  </form>
  <div id="signedout" class="panel">Log in or sign up to post your own favorite things.</div>

  <div id="feed" class="feed"></div>
  <div id="empty" hidden>Nothing here yet. Be the first to post.</div>
  </div>
</main>

<dialog id="postDlg">
  <img id="postImg" alt="">
  <div id="postWait" class="muted" hidden></div>
  <h3 id="postTitle"></h3>
  <p id="postNote"></p>
  <div class="meta"><button type="button" class="link by" id="postBy"></button><span id="postDate"></span></div>
  <div class="row" style="margin-top:12px"><button type="button" id="postDel" class="del" hidden>Delete</button><button type="button" class="primary" id="postClose">Close</button></div>
</dialog>

<dialog id="authDlg">
  <form id="authForm" method="dialog">
    <h2 id="authTitle">Log in</h2>
    <input id="name" type="text" maxlength="30" placeholder="Display name" autocomplete="nickname" hidden>
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <div class="passrow">
      <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" required minlength="6">
      <button type="button" id="showPass" aria-pressed="false">Show</button>
    </div>
    <div id="authMsg" class="err" style="font-size:14px" role="status"></div>
    <div class="row">
      <button type="button" id="cancelAuth">Cancel</button>
      <button class="primary" id="authGo">Log in</button>
    </div>
    <button type="button" class="link" id="forgot">Forgot password?</button>
    <button type="button" class="link" id="toggleAuth">New here? Create an account</button>
  </form>
</dialog>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, set, get, update, onValue, query, limitToLast, orderByChild, equalTo, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyD2PDm2Jgco7ZZt90uyptESiL9vWpNhXWM",
  authDomain: "allapps-74c50.firebaseapp.com",
  databaseURL: "https://allapps-74c50-default-rtdb.firebaseio.com",
  projectId: "allapps-74c50",
});
const POSTS = "apps/favoritethings/posts";
const USERS = "apps/favoritethings/users";
const IMAGES = "apps/favoritethings/images";
const auth = getAuth(app);
const db = getDatabase(app);
const $ = id => document.getElementById(id);
const openAuthBtn = $("openAuth");

let user = null;
let signup = false;
let imageData = null;
let posts = [];
let people = [];
let profile = null;      // { uid, name }
let profilePosts = [];
let stopProfile = null;
let tab = "feed";


// ---------- pixel farm scene in the header ----------
function drawScene() {
  const c = $("scene"), g = c.getContext("2d");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const R = (col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const W = c.width, H = c.height;
  const bands = 6;
  for (let i = 0; i < bands; i++) {
    R(i % 2 ? css("--sky2") : css("--sky1"), 0, Math.floor(i * 24 / bands), W, Math.ceil(24 / bands));
  }
  R(css("--sky1"), 0, 0, W, 4);
  // sun
  R(css("--sun"), 196, 4, 8, 8); R(css("--sun"), 194, 6, 12, 4); R(css("--sun"), 198, 2, 4, 12);
  // clouds
  for (const [x, y] of [[30, 6], [110, 3], [150, 9]]) {
    R(css("--cloud"), x, y + 2, 16, 4); R(css("--cloud"), x + 3, y, 10, 6); R(css("--cloud"), x + 6, y - 1, 5, 2);
  }
  // hills
  R(css("--hill2"), 0, 18, W, 18);
  for (let x = 0; x < W; x += 2) { const h = Math.round(3 + 3 * Math.sin(x / 17) + 2 * Math.sin(x / 7)); R(css("--hill2"), x, 18 - h + 2, 2, h); }
  R(css("--hill"), 0, 24, W, 12);
  for (let x = 0; x < W; x += 2) { const h = Math.round(2 + 2 * Math.sin(x / 11 + 2)); R(css("--hill"), x, 24 - h, 2, h + 1); }
  // house
  R("#8a5a2e", 20, 14, 28, 14); R("#6e4521", 20, 26, 28, 2);
  R("#b83a2a", 17, 10, 34, 4); R("#b83a2a", 20, 7, 28, 3); R("#b83a2a", 24, 5, 20, 2); R("#8e2a1e", 17, 13, 34, 1);
  R("#ffe9a8", 25, 17, 6, 6); R("#6e4521", 27, 17, 2, 6); R("#6e4521", 25, 19, 6, 2);
  R("#5b3a1e", 38, 18, 6, 10); R("#d6a24a", 42, 23, 1, 1);
  R("#7a7a7a", 42, 2, 4, 6); R("#555", 41, 2, 6, 1);
  // trees
  for (const x of [66, 176]) { R("#6b4220", x + 3, 20, 3, 9); R("#2f7a32", x, 10, 9, 6); R("#3f9a3c", x + 1, 6, 7, 6); R("#2f7a32", x + 2, 3, 5, 4); R("#58b852", x + 3, 7, 2, 2); }
  // fence
  for (let x = 74; x < 140; x += 8) R("#c98d4a", x, 25, 2, 6);
  R("#e0a85c", 74, 26, 66, 1); R("#e0a85c", 74, 29, 66, 1);
  // crop rows
  for (let row = 0; row < 2; row++) {
    const y = 30 + row * 3;
    R("#7a4a22", 0, y, W, 2);
    for (let x = row * 3; x < W; x += 6) { R("#3f9a3c", x, y - 3, 1, 3); R("#7ad06a", x - 1, y - 4, 3, 1); if ((x + row) % 12 === 0) R("#ff8a3c", x, y - 5, 2, 2); }
  }
}
drawScene();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawScene);

// ---------- auth ----------
function authError(e) {
  const c = e.code || "";
  if (c.includes("operation-not-allowed")) return "Email sign-in isn't turned on in Firebase yet.";
  if (c.includes("email-already-in-use")) return "That email already has an account. Try logging in.";
  if (c.includes("weak-password")) return "Password needs at least 6 characters.";
  if (c.includes("invalid-email")) return "That email doesn't look right.";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Wrong email or password. Not sure? Tap Forgot password.";
  if (c.includes("too-many-requests")) return "Too many tries. Wait a minute and try again.";
  return "Couldn't sign in (" + (c || e.message) + ")";
}

function setMode(isSignup) {
  signup = isSignup;
  $("authTitle").textContent = isSignup ? "Create an account" : "Log in";
  $("authGo").textContent = isSignup ? "Sign up" : "Log in";
  $("name").hidden = !isSignup;
  $("name").required = isSignup;
  $("pass").autocomplete = isSignup ? "new-password" : "current-password";
  $("toggleAuth").textContent = isSignup ? "Have an account? Log in" : "New here? Create an account";
  $("forgot").hidden = isSignup;
  authSay("");
}

function authSay(text, ok) { const m = $("authMsg"); m.textContent = text; m.className = ok ? "ok" : "err"; }

let lastEmail = "";
try { lastEmail = localStorage.getItem("ft-email") || ""; } catch { /* ignore */ }

$("openAuth").addEventListener("click", () => {
  setMode(false);
  if (lastEmail && !$("email").value) $("email").value = lastEmail;
  $("authDlg").showModal();
  ($("email").value ? $("pass") : $("email")).focus();
});

$("showPass").addEventListener("click", () => {
  const show = $("pass").type === "password";
  $("pass").type = show ? "text" : "password";
  $("showPass").textContent = show ? "Hide" : "Show";
  $("showPass").setAttribute("aria-pressed", String(show));
});

$("forgot").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) { authSay("Type your email above first, then tap Forgot password."); $("email").focus(); return; }
  $("forgot").disabled = true;
  try {
    await sendPasswordResetEmail(auth, email);
    authSay("Reset email sent to " + email + ". Check your inbox and spam folder, tap the link, pick a new password, then log in here.", true);
  } catch (err) {
    const c = err.code || "";
    authSay(c.includes("invalid-email") ? "That email doesn't look right." : c.includes("too-many-requests") ? "Too many tries. Wait a minute and try again." : "Couldn't send the reset email (" + (c || err.message) + ")");
  } finally {
    $("forgot").disabled = false;
  }
});
$("cancelAuth").addEventListener("click", () => $("authDlg").close());
$("toggleAuth").addEventListener("click", () => setMode(!signup));

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("authGo").disabled = true;
  authSay("");
  try {
    const email = $("email").value.trim(), pass = $("pass").value;
    try { localStorage.setItem("ft-email", email); lastEmail = email; } catch { /* ignore */ }
    if (signup) {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: $("name").value.trim().slice(0, 30) });
      user = auth.currentUser;
      register();
      renderWho();
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    $("authDlg").close();
    $("authForm").reset();
    $("pass").type = "password"; $("showPass").textContent = "Show";
  } catch (err) {
    if ((err.code || "").includes("email-already-in-use")) {
      setMode(false);
      authSay("That email already has an account. Log in below, or tap Forgot password.");
    } else {
      authSay(authError(err));
    }
  } finally {
    $("authGo").disabled = false;
  }
});

function renderWho() {
  const who = $("who");
  who.textContent = "";
  if (user) {
    const b = document.createElement("b");
    b.textContent = user.displayName || user.email;
    const out = document.createElement("button");
    out.textContent = "Log out";
    out.addEventListener("click", () => signOut(auth));
    who.append(b, out);
  } else {
    who.appendChild(openAuthBtn);
  }
  $("post").hidden = !user;
  $("signedout").hidden = !!user;
  renderFeed();
}

// Everyone who signs up is listed in People (name only, never the email).
function register() {
  if (!user) return;
  const name = (user.displayName || user.email.split("@")[0]).slice(0, 30);
  set(ref(db, USERS + "/" + user.uid), { name, ts: serverTimestamp() }).catch(() => {});
}

onAuthStateChanged(auth, u => { user = u; register(); renderWho(); });

// ---------- posting ----------
function shrink(file, max = 900, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a picture we can read.")); };
    img.src = url;
  });
}

function say(text, isErr) { const m = $("msg"); m.textContent = text; m.className = isErr ? "err" : ""; }

$("file").addEventListener("change", async () => {
  imageData = null;
  $("preview").hidden = true;
  const f = $("file").files[0];
  if (!f) return;
  try {
    imageData = await shrink(f);
    $("preview").src = imageData;
    $("preview").hidden = false;
    say("");
  } catch (e) { say(e.message, true); }
});

$("post").addEventListener("submit", async e => {
  e.preventDefault();
  if (!user || !imageData) { say("Pick a picture first.", true); return; }
  $("submitPost").disabled = true;
  say("Posting…");
  try {
    const id = push(ref(db, POSTS)).key;
    await update(ref(db), {
      [POSTS + "/" + id]: {
        uid: user.uid,
        author: (user.displayName || user.email.split("@")[0]).slice(0, 30),
        title: $("title").value.trim().slice(0, 80),
        note: $("note").value.trim().slice(0, 300),
        ts: serverTimestamp(),
      },
      [IMAGES + "/" + id]: { uid: user.uid, image: imageData },
    });
    $("post").reset();
    $("preview").hidden = true;
    imageData = null;
    say("Posted.");
  } catch (err) {
    say(err.code === "PERMISSION_DENIED" ? "Posting is blocked by the database rules." : "Couldn't post (" + (err.code || err.message) + ")", true);
  } finally {
    $("submitPost").disabled = false;
  }
});

// ---------- feed ----------

function renderFeed() {
  renderPosts($("feed"), posts);
  $("empty").hidden = posts.length > 0;
  renderProfile();
}

function when(ts) {
  return typeof ts === "number" ? new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
}

// A list of rows (title, author, date). Tap a row to see the picture.
function renderPosts(feed, list) {
  feed.textContent = "";
  for (const p of list) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "prow panel";
    const t = document.createElement("span");
    t.className = "ptitle";
    t.textContent = p.title;
    const m = document.createElement("small");
    m.textContent = p.author + (when(p.ts) ? " · " + when(p.ts) : "");
    row.append(t, m);
    row.addEventListener("click", () => openPost(p));
    feed.appendChild(row);
  }
}

let shown = null;
function openPost(p) {
  shown = p;
  const img = $("postImg");
  img.removeAttribute("src");
  img.alt = p.title;
  $("postWait").hidden = false;
  $("postWait").textContent = "Loading picture…";
  get(ref(db, IMAGES + "/" + p.id)).then(snap => {
    if (shown !== p) return;
    const v = snap.val();
    if (v && v.image) { img.src = v.image; $("postWait").hidden = true; }
    else $("postWait").textContent = "No picture found.";
  }).catch(() => { if (shown === p) $("postWait").textContent = "Couldn't load the picture."; });
  $("postTitle").textContent = p.title;
  $("postNote").textContent = p.note || "";
  $("postNote").hidden = !p.note;
  $("postBy").textContent = "by " + p.author;
  $("postDate").textContent = when(p.ts);
  const d = $("postDel");
  d.hidden = !(user && user.uid === p.uid);
  d.textContent = "Delete";
  delete d.dataset.sure;
  $("postDlg").showModal();
}

$("postClose").addEventListener("click", () => $("postDlg").close());
$("postBy").addEventListener("click", () => { if (!shown) return; $("postDlg").close(); openProfile(shown.uid, shown.author); });
$("postDel").addEventListener("click", e => {
  const d = e.currentTarget;
  if (!shown) return;
  if (!d.dataset.sure) { d.dataset.sure = "1"; d.textContent = "Tap again to delete"; return; }
  update(ref(db), { [POSTS + "/" + shown.id]: null, [IMAGES + "/" + shown.id]: null });
  $("postDlg").close();
});

// ---------- people and profiles ----------
function showTab(t) {
  tab = t;
  $("vFeed").hidden = t !== "feed";
  $("vPeople").hidden = t !== "people";
  $("vProfile").hidden = t !== "profile";
  $("tabFeed").classList.toggle("on", t === "feed");
  $("tabPeople").classList.toggle("on", t === "people" || t === "profile");
  if (t !== "profile" && stopProfile) { stopProfile(); stopProfile = null; }
}

$("tabFeed").addEventListener("click", () => showTab("feed"));
$("tabPeople").addEventListener("click", () => showTab("people"));
$("backBtn").addEventListener("click", () => showTab("people"));
$("search").addEventListener("input", renderPeople);

function renderPeople() {
  const q = $("search").value.trim().toLowerCase();
  const list = $("peopleList");
  list.textContent = "";
  const shown = people.filter(p => p.name.toLowerCase().includes(q));
  $("peopleEmpty").hidden = shown.length > 0;
  $("peopleEmpty").textContent = people.length ? "No one found." : "No one has signed up yet.";
  for (const p of shown) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "person panel";
    const n = document.createElement("span");
    n.textContent = p.name;
    b.appendChild(n);
    if (user && user.uid === p.uid) { const s = document.createElement("small"); s.textContent = "you"; b.appendChild(s); }
    b.addEventListener("click", () => openProfile(p.uid, p.name));
    li.appendChild(b);
    list.appendChild(li);
  }
}

function openProfile(uid, name) {
  if (stopProfile) { stopProfile(); stopProfile = null; }
  profile = { uid, name };
  profilePosts = [];
  $("profName").textContent = name + "'s favorites";
  showTab("profile");
  renderProfile();
  stopProfile = onValue(query(ref(db, POSTS), orderByChild("uid"), equalTo(uid)), snap => {
    const list = [];
    snap.forEach(c => { const v = c.val(); if (v && v.title) list.push({ id: c.key, ...v }); });
    profilePosts = list.reverse();
    renderProfile();
  }, () => { $("profEmpty").hidden = false; $("profEmpty").textContent = "Can't load this profile right now."; });
}

function renderProfile() {
  if (!profile) return;
  renderPosts($("profFeed"), profilePosts);
  $("profEmpty").hidden = profilePosts.length > 0;
  $("profEmpty").textContent = "No favorites posted yet.";
}

onValue(ref(db, USERS), snap => {
  const list = [];
  snap.forEach(c => { const v = c.val(); if (v && typeof v.name === "string") list.push({ uid: c.key, name: v.name }); });
  list.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
  people = list;
  renderPeople();
}, () => { $("peopleEmpty").hidden = false; $("peopleEmpty").textContent = "Can't load people right now."; });

onValue(query(ref(db, POSTS), limitToLast(40)), snap => {
  const list = [];
  snap.forEach(c => { const v = c.val(); if (v && v.title) list.push({ id: c.key, ...v }); });
  posts = list.reverse();
  renderFeed();
}, () => { $("empty").hidden = false; $("empty").textContent = "Can't load posts right now."; });
</script>
</body>
